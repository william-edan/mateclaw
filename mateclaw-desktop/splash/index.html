<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>化帆AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #f7f1e8;
        color: #2f241d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: 100%;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 12px 24px rgba(102, 73, 52, 0.16));
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
        font-weight: 760;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #7b6a5d;
        font-size: 14px;
      }

      .bar {
        width: 180px;
        height: 4px;
        margin: 24px auto 0;
        border-radius: 999px;
        overflow: hidden;
        background: #e7d7c9;
      }

      .bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #f26a3d;
        animation: loading 1.35s ease-in-out infinite;
      }

      .error {
        display: none;
        margin-top: 18px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fff3ef;
        color: #a83f23;
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      @keyframes loading {
        0% {
          transform: translateX(-80%);
        }
        50% {
          transform: translateX(90%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./mateclaw_logo_s.png" alt="化帆AI" />
      <h1>化帆AI</h1>
      <p>Starting local workspace...</p>
      <div class="bar" aria-hidden="true"></div>
      <div id="error" class="error"></div>
    </main>
    <script>
      window.addEventListener("mateclaw-startup-error", (event) => {
        const el = document.getElementById("error")
        el.textContent = event.detail || "Startup failed."
        el.style.display = "block"
      })
    </script>
  </body>
</html>
