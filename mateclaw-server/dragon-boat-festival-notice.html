<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年端午节放假通知</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5efe6;
    font-family: 'Noto Serif SC', serif;
  }

  .poster {
    width: 800px;
    min-height: 1200px;
    background: linear-gradient(160deg, #fdf8f0 0%, #f5e6d0 30%, #e8d5b8 60%, #d4c4a8 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  /* Decorative background elements */
  .bg-wave {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 300px;
    background: linear-gradient(180deg, transparent 0%, rgba(107, 142, 68, 0.08) 40%, rgba(107, 142, 68, 0.15) 100%);
    border-radius: 50% 50% 0 0 / 30% 30% 0 0;
  }

  .bg-wave-2 {
    position: absolute;
    bottom: 0;
    left: -50px;
    right: -50px;
    height: 200px;
    background: linear-gradient(180deg, transparent 0%, rgba(180, 60, 60, 0.06) 60%, rgba(180, 60, 60, 0.10) 100%);
    border-radius: 40% 60% 0 0 / 20% 30% 0 0;
  }

  .cloud {
    position: absolute;
    opacity: 0.12;
    font-size: 80px;
    color: #b43c3c;
  }
  .cloud-1 { top: 30px; right: 40px; transform: rotate(10deg); }
  .cloud-2 { top: 80px; left: 30px; transform: rotate(-15deg); font-size: 60px; opacity: 0.08; }

  /* Top decorative border */
  .top-border {
    position: relative;
    height: 16px;
    background: linear-gradient(90deg, #b43c3c, #d4a853, #b43c3c);
  }
  .top-border::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, transparent, rgba(180, 60, 60, 0.3), transparent);
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 40px 50px 50px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .dragon-boat-icon {
    font-size: 56px;
    margin-bottom: 10px;
    display: block;
  }

  .main-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 52px;
    color: #8b1a1a;
    letter-spacing: 8px;
    text-shadow: 2px 2px 4px rgba(139, 26, 26, 0.15);
    margin-bottom: 8px;
  }

  .title-underline {
    width: 200px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d4a853, #b43c3c, #d4a853, transparent);
    margin: 10px auto;
  }

  .subtitle {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 20px;
    color: #6b6b4e;
    letter-spacing: 4px;
    margin-top: 10px;
  }

  /* Decorative divider */
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180, 60, 60, 0.3), transparent);
  }
  .divider-icon {
    padding: 0 15px;
    font-size: 20px;
    color: #b43c3c;
    opacity: 0.6;
  }

  /* Date highlight box */
  .date-box {
    background: linear-gradient(135deg, rgba(180, 60, 60, 0.08), rgba(212, 168, 83, 0.08));
    border: 2px solid rgba(180, 60, 60, 0.2);
    border-radius: 12px;
    padding: 25px 30px;
    text-align: center;
    margin-bottom: 30px;
    position: relative;
  }
  .date-box::before {
    content: '🐉';
    position: absolute;
    top: -15px;
    left: 20px;
    font-size: 30px;
  }
  .date-box::after {
    content: '🐉';
    position: absolute;
    bottom: -15px;
    right: 20px;
    font-size: 30px;
    transform: scaleX(-1);
  }

  .date-range {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 38px;
    color: #8b1a1a;
    letter-spacing: 4px;
  }
  .date-detail {
    font-size: 18px;
    color: #6b6b4e;
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .date-tags {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 15px;
  }
  .tag {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 700;
  }
  .tag-red {
    background: #b43c3c;
    color: #fff;
  }
  .tag-gold {
    background: #d4a853;
    color: #fff;
  }
  .tag-green {
    background: #5a7a3a;
    color: #fff;
  }

  /* Info cards */
  .section-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: #8b1a1a;
    letter-spacing: 4px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title .icon {
    font-size: 24px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
  }

  .info-card {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(180, 60, 60, 0.12);
    border-radius: 12px;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .info-card.full {
    grid-column: 1 / -1;
  }

  .info-card h3 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 22px;
    color: #5a7a3a;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .info-card ul {
    list-style: none;
  }
  .info-card ul li {
    font-size: 16px;
    color: #4a4a3a;
    padding: 6px 0;
    padding-left: 24px;
    position: relative;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .info-card ul li::before {
    content: '✦';
    position: absolute;
    left: 0;
    color: #d4a853;
    font-size: 12px;
  }

  /* Customs section */
  .customs-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 30px;
  }
  .custom-item {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(180, 60, 60, 0.10);
    border-radius: 10px;
    padding: 15px 10px;
    text-align: center;
    transition: transform 0.2s;
  }
  .custom-item:hover {
    transform: translateY(-2px);
  }
  .custom-item .emoji {
    font-size: 36px;
    display: block;
    margin-bottom: 8px;
  }
  .custom-item .label {
    font-size: 15px;
    color: #4a4a3a;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* Blessing */
  .blessing {
    text-align: center;
    padding: 20px;
    margin-top: 10px;
    border-top: 1px solid rgba(180, 60, 60, 0.15);
  }
  .blessing-text {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 32px;
    color: #8b1a1a;
    letter-spacing: 6px;
  }
  .blessing-sub {
    font-size: 14px;
    color: #8a8a6a;
    margin-top: 8px;
    letter-spacing: 2px;
  }

  /* Bottom decorative border */
  .bottom-border {
    position: relative;
    height: 16px;
    background: linear-gradient(90deg, #b43c3c, #d4a853, #b43c3c);
    margin-top: 20px;
  }
  .bottom-border::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, transparent, rgba(180, 60, 60, 0.3), transparent);
  }

  /* Decorative corner elements */
  .corner {
    position: absolute;
    font-size: 40px;
    opacity: 0.15;
    color: #b43c3c;
  }
  .corner-tl { top: 20px; left: 20px; }
  .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner-bl { bottom: 40px; left: 20px; transform: scaleY(-1); }
  .corner-br { bottom: 40px; right: 20px; transform: scale(-1, -1); }

  /* Responsive */
  @media (max-width: 820px) {
    .poster { width: 100%; min-height: auto; }
    .content { padding: 30px 25px; }
    .main-title { font-size: 38px; }
    .date-range { font-size: 30px; }
    .customs-grid { grid-template-columns: repeat(2, 1fr); }
    .info-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="poster">
  <!-- Background decorations -->
  <div class="bg-wave"></div>
  <div class="bg-wave-2"></div>
  <div class="cloud cloud-1">☁</div>
  <div class="cloud cloud-2">☁</div>
  <div class="corner corner-tl">🎋</div>
  <div class="corner corner-tr">🎋</div>
  <div class="corner corner-bl">🎋</div>
  <div class="corner corner-br">🎋</div>

  <!-- Top border -->
  <div class="top-border"></div>

  <!-- Content -->
  <div class="content">
    <!-- Header -->
    <div class="header">
      <span class="dragon-boat-icon">🐉</span>
      <h1 class="main-title">端 午 放 假 通 知</h1>
      <div class="title-underline"></div>
      <p class="subtitle">— 二〇二六年 农历五月初五 —</p>
    </div>

    <!-- Date highlight -->
    <div class="date-box">
      <div class="date-range">6月19日 — 6月21日</div>
      <div class="date-detail">端午节 · 6月19日（星期五）</div>
      <div class="date-tags">
        <span class="tag tag-red">放假3天</span>
        <span class="tag tag-green">无需调休</span>
      </div>
    </div>

    <!-- Info sections -->
    <div class="info-grid">
      <div class="info-card">
        <h3>📋 放假安排</h3>
        <ul>
          <li>6月19日（周五）至6月21日（周日）放假，共3天</li>
          <li>6月22日（周一）正常上班</li>
          <li>本次放假无需调休</li>
        </ul>
      </div>
      <div class="info-card">
        <h3>💡 温馨提示</h3>
        <ul>
          <li>请各部门提前做好工作安排</li>
          <li>假期期间注意安全出行</li>
          <li>做好个人健康防护</li>
        </ul>
      </div>
    </div>

    <!-- Customs -->
    <div class="section-title">
      <span class="icon">🎭</span> 端午习俗
    </div>
    <div class="customs-grid">
      <div class="custom-item">
        <span class="emoji">🍙</span>
        <span class="label">吃粽子</span>
      </div>
      <div class="custom-item">
        <span class="emoji">🐲</span>
        <span class="label">赛龙舟</span>
      </div>
      <div class="custom-item">
        <span class="emoji">🌿</span>
        <span class="label">挂艾草</span>
      </div>
      <div class="custom-item">
        <span class="emoji">🪭</span>
        <span class="label">佩香囊</span>
      </div>
    </div>

    <!-- Blessing -->
    <div class="blessing">
      <div class="blessing-text">端午安康 · 阖家幸福</div>
      <div class="blessing-sub">— 祝大家度过一个祥和愉快的端午假期 —</div>
    </div>
  </div>

  <!-- Bottom border -->
  <div class="bottom-border"></div>
</div>
</body>
</html>
